services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aura_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aura_net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB:-aura_ai}
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./data:/app/data:ro
    networks: [aura_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:8080}:80"
    depends_on:
      - backend
    networks: [aura_net]

volumes:
  pgdata:

networks:
  aura_net:
    driver: bridge
